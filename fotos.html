<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fotos de llantas | Eurollantas</title>
<link rel="icon" href="logo.jpg">
<style>
:root { color-scheme: dark; --ink:#f5efe7; --flame:#ff7a00; }
* { box-sizing: border-box; }
body { margin: 0; background: #000; color: var(--ink); font: 400 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 16px; }
.back { display: inline-block; color: var(--flame); text-decoration: none; font-weight: 600; padding: 8px 0 14px; }
.slider { position: relative; }
.track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; border-radius: 12px; }
.track::-webkit-scrollbar { display: none; }
.track img { flex: 0 0 100%; width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: cover; scroll-snap-align: center; scroll-snap-stop: always; background: #111; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 26px; line-height: 1; cursor: pointer; }
.prev { left: 8px; } .next { right: 8px; }
.nav[hidden] { display: none; }
.dots { display: flex; justify-content: center; gap: 8px; margin: 14px 0 0; }
.dots button { width: 10px; height: 10px; padding: 0; border: 0; border-radius: 50%; background: #4a4440; cursor: pointer; }
.dots button.on { background: var(--flame); }
.btn { display: block; margin-top: 20px; padding: 16px; text-align: center; background: #25d366; color: #05200f; border-radius: 12px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <a class="back" href="./">← Volver</a>
  <div class="slider">
    <div class="track" id="track" role="region" aria-label="Fotos de llantas" tabindex="0">
    <img src="fotos/llantas-1.jpg" width="560" height="560" alt="Llantas seminuevas en buen estado, foto 1">
    <img src="fotos/llantas-2.jpg" width="560" height="560" loading="lazy" alt="Llantas seminuevas en buen estado, foto 2">
    <img src="fotos/llantas-3.jpg" width="560" height="560" loading="lazy" alt="Llantas seminuevas en buen estado, foto 3">
    <img src="fotos/llantas-4.jpg" width="560" height="560" loading="lazy" alt="Llantas seminuevas en buen estado, foto 4">
    <img src="fotos/llantas-5.jpg" width="560" height="560" loading="lazy" alt="Llantas seminuevas en buen estado, foto 5">
    <img src="fotos/llantas-6.jpg" width="560" height="560" loading="lazy" alt="Llantas seminuevas en buen estado, foto 6">
    <img src="fotos/llantas-7.jpg" width="560" height="560" loading="lazy" alt="Llantas seminuevas en buen estado, foto 7">
    </div>
    <button class="nav prev" id="prev" type="button" aria-label="Anterior">‹</button>
    <button class="nav next" id="next" type="button" aria-label="Siguiente">›</button>
  </div>
  <div class="dots" id="dots"><button type="button" aria-label="Foto 1"></button><button type="button" aria-label="Foto 2"></button><button type="button" aria-label="Foto 3"></button><button type="button" aria-label="Foto 4"></button><button type="button" aria-label="Foto 5"></button><button type="button" aria-label="Foto 6"></button><button type="button" aria-label="Foto 7"></button></div>
  <a class="btn" href="https://wa.me/5073909390?text=Hola%20Eurollantas,%20quiero%20informaci%C3%B3n%20sobre%20llantas" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>
</main>
<script>
(function () {
  var t = document.getElementById("track"), d = document.querySelectorAll("#dots button");
  var p = document.getElementById("prev"), n = document.getElementById("next");
  function idx() { return Math.round(t.scrollLeft / t.clientWidth); }
  var cur = 0;
  function go(i) { i = Math.max(0, Math.min(d.length - 1, i)); cur = i; t.scrollTo({ left: i * t.clientWidth, behavior: "smooth" }); }
  function upd() {
    var i = idx(); cur = i;
    for (var k = 0; k < d.length; k++) d[k].className = k === i ? "on" : "";
    p.hidden = i === 0; n.hidden = i === d.length - 1;
  }
  t.addEventListener("scroll", upd, { passive: true });
  p.onclick = function () { go(cur - 1); };
  n.onclick = function () { go(cur + 1); };
  for (var k = 0; k < d.length; k++) (function (j) { d[j].onclick = function () { go(j); }; })(k);
  t.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(cur + 1); else if (e.key === "ArrowLeft") go(cur - 1);
  });
  upd();
})();
</script>
</body>
</html>
